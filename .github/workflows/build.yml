name: Build KeyMate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.425
      - run: dotnet restore KeyMate.sln --locked-mode
      - run: dotnet build KeyMate.sln -c Release --no-restore
      - run: dotnet run --project tests/KeyMate.Tests -c Release --no-build
      - run: ./publish.ps1
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KeyMate-win-x64
          path: artifacts/win-x64/
          retention-days: 14
